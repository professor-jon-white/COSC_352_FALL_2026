[package]
name = "baltimore-municipal-intelligence-engine"
version = "0.1.0"
edition = "2021"
description = "Offline-first municipal data analytics demonstration"

[[bin]]
name = "bmie"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
