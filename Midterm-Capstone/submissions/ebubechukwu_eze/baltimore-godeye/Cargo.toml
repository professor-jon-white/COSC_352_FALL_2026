[package]
name = "baltimore-godeye"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Concurrent cross-dataset analytics over Open Baltimore data for municipal stakeholders"

[dependencies]
crossbeam-channel = "0.5"
csv = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
